name: Build atrac-api Docker image

on:
  workflow_dispatch:
  push:
    paths:
      - 'atrac_api_upstream_latest_commit.txt'
      - 'atrac_api_docker_base_image_version.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner}}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone atrac-api
        uses: actions/checkout@v7
        with:
          repository: MiniDisc-wiki/atrac-api
          path: atrac-api

      - name: Add dummy psp_at3tool.exe
        run: |
          cd atrac-api
          touch psp_at3tool.exe

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: atrac-api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cmsj/atrac-api:latest

      - name: Delete old images
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'atrac-api'
          package-type: 'container'
          min-versions-to-keep: 5
