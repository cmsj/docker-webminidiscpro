name: Check dependency versions
on:
  workflow_dispatch:
  schedule:
    - cron:  '0 05 * * *'
jobs:
  check-dependency-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.REPO_SCOPED_TOKEN }}

# First handle webminidiscpro
      - name: Check out webminidiscpro
        uses: actions/checkout@v7
        with:
          repository: asivery/webminidisc
          path: webminidisc

      - name: Extract webminidiscpro target base image name/label
        id: base_image_webminidiscpro
        run: echo "label=$(grep FROM webminidisc/Dockerfile | awk '{ print $2 }')" >> $GITHUB_OUTPUT

      - name: Ensure we have the latest version of webminidiscpro base image
        run: sudo docker pull ${{ steps.base_image_webminidiscpro.outputs.label }}

      - name: Capture webminidiscpro base image hash
        run: docker images --format '{{.Repository}} {{.Tag}} {{.ID}}' ${{ steps.base_image_webminidiscpro.outputs.label }} >webminidiscpro_docker_base_image_version.txt

      - name: Capture webminidiscpro upstream git repo HEAD
        run: bash -c "pushd webminidisc >/dev/null ; git rev-parse HEAD ; popd >/dev/null" >webminidiscpro_upstream_latest_commit.txt

# Second handle atrac-api
      - name: Check out atrac-api
        uses: actions/checkout@v7
        with:
          repository: MiniDisc-wiki/atrac-api
          path: atrac-api

      - name: Extract webminidiscpro target base image name/label
        id: base_image_atracapi
        run: echo "label=$(grep FROM atrac-api/Dockerfile | awk '{ print $2 }')" >> $GITHUB_OUTPUT

      - name: Ensure we have the latest version of atrac-api base image
        run: sudo docker pull ${{ steps.base_image_atracapi.outputs.label }}

      - name: Capture atrac-api base image hash
        run: docker images --format '{{.Repository}} {{.Tag}} {{.ID}}' ${{ steps.base_image_atracapi.outputs.label }} >atrac_api_docker_base_image_version.txt

      - name: Capture atrac-api upstream git repo HEAD
        run: bash -c "pushd atrac-api >/dev/null ; git rev-parse HEAD ; popd >/dev/null" >atrac_api_upstream_latest_commit.txt

# Now process the results and commit if there are any changes
      - name: Check for modified files
        id: git-check
        run: echo "modified=$([ -z "$(git status --porcelain)" ] && echo "false" || echo "true")" >> $GITHUB_OUTPUT

      - name: Commit latest release version
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git commit -am "New upstream release"
          git push
